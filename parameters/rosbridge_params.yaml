/**/rosbridge_websocket:
  ros__parameters:
    port: 9090
    address: ""                    # Address to bind to (empty string means all interfaces)
    url_path: "/"

    # SSL
#    certfile: ""                   # Path to SSL certificate file
#    keyfile: ""                    # Path to SSL private key file

    retry_startup_delay: 5.0

    fragment_timeout: 600          # Timeout (in seconds) for fragmented messages
    delay_between_messages: 0
    max_message_size: 10000000     # Maximum size (in bytes) of incoming messages
    unregister_timeout: 10.0

    use_compression: false
    call_services_in_new_thread: true
    default_call_service_timeout: 5.0
    send_action_goals_in_new_thread: true

    topics_glob: ""                # Glob patterns for filtering
    services_glob: ""
    params_glob: ""
    bson_only_mode: false

/**/rosapi:
  ros__parameters:
    topics_glob: ""                # Glob patterns for filtering in rosapi
    services_glob: ""
    params_glob: ""
    params_timeout: 5.0
